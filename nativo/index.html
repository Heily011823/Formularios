<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro (versión nativa)</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Crear cuenta</h1>

  <!-- NIVEL 1: para probar la validación nativa del navegador, quita "novalidate".
       NIVEL 2 y 3: novalidate debe estar puesto. -->
  <form id="registro" action="https://jsonplaceholder.typicode.com/posts" method="post" novalidate>

    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" type="text"
           required minlength="3" maxlength="60" autocomplete="name"
           aria-describedby="nombre-error">
    <p id="nombre-error" class="error" aria-live="polite"></p>

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required autocomplete="email"
           aria-describedby="email-error">
    <p id="email-error" class="error" aria-live="polite"></p>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password"
           required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
           autocomplete="new-password" aria-describedby="password-error">
    <p id="password-error" class="error" aria-live="polite"></p>

    <label for="confirmar">Confirmar contraseña</label>
    <input id="confirmar" name="confirmar" type="password" required
           autocomplete="new-password" aria-describedby="confirmar-error">
    <p id="confirmar-error" class="error" aria-live="polite"></p>

    <label for="edad">Edad</label>
    <input id="edad" name="edad" type="number" inputmode="numeric"
           required min="18" max="120" step="1" aria-describedby="edad-error">
    <p id="edad-error" class="error" aria-live="polite"></p>

    <label for="pais">País</label>
    <select id="pais" name="pais" required aria-describedby="pais-error">
      <option value="">Elige un país</option>
      <option value="CO">Colombia</option>
      <option value="MX">México</option>
      <option value="AR">Argentina</option>
      <option value="CL">Chile</option>
      <option value="PE">Perú</option>
      <option value="ES">España</option>
      <option value="OT">Otro</option>
    </select>
    <p id="pais-error" class="error" aria-live="polite"></p>

    <div class="check">
      <input id="terminos" name="terminos" type="checkbox" required aria-describedby="terminos-error">
      <label for="terminos">Acepto los términos y condiciones</label>
    </div>
    <p id="terminos-error" class="error" aria-live="polite"></p>

    <button type="submit">Crear cuenta</button>
    <p id="mensaje" role="status"></p>
    <p id="saludo" role="status"></p>
  </form>

  <script src="app.js"></script>
</body>
</html>
